name: Verify Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, such as v1.0.0. Leave blank to verify only.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Test and package the Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the .NET SDK version' }

          dotnet test VerticalLineCounter.slnx -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }

          $publish = Join-Path $env:RUNNER_TEMP 'VerticalLineCounter-win-x64'
          dotnet publish VerticalLineCounter/VerticalLineCounter.csproj -c Release -r win-x64 --self-contained true -o $publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }

          $exe = Join-Path $publish 'VerticalLineCounter.exe'
          $fixtures = (Resolve-Path 'VerticalLineCounter.Tests/Fixtures/Generated').Path

          function Assert-Output {
              param([string]$Case, [string]$Expected, [string[]]$CliArgs)

              $output = & $exe @CliArgs 2>&1
              $exitCode = $LASTEXITCODE
              $actual = ($output -join "`n").Trim()

              if ($exitCode -ne 0 -or $actual -cne $Expected) {
                  throw "$Case expected '$Expected', got '$actual' (exit $exitCode)"
              }
              Write-Host "$Case passed with output '$actual'"
          }

          $counts = [ordered]@{
              'single-thick-line.jpg' = 1
              'three-lines.jpg'       = 3
              'full-black.jpg'        = 1
              'seven-mixed-lines.jpg' = 7
              'all-white.jpg'         = 0
              'single-thin-line.jpg'  = 1
              'thin-white-gap.jpg'    = 2
              'boundary-lines.jpg'    = 2
              'five-even-lines.jpg'   = 5
          }

          foreach ($name in $counts.Keys) {
              Assert-Output -Case $name -Expected "$($counts[$name])" -CliArgs @((Join-Path $fixtures $name))
          }

          $spacedPath = Join-Path $env:RUNNER_TEMP 'boundary lines.jpg'
          $missingPath = Join-Path $env:RUNNER_TEMP 'missing image.jpg'
          $invalidPath = Join-Path $env:RUNNER_TEMP 'invalid image.jpg'
          Copy-Item (Join-Path $fixtures 'boundary-lines.jpg') $spacedPath
          Set-Content -LiteralPath $invalidPath -Value 'This file is not a JPEG.'

          $usage = 'Usage: VerticalLineCounter <absolute-image-path>'
          Assert-Output -Case 'Absolute path with spaces' -Expected '2' -CliArgs @($spacedPath)
          Assert-Output -Case 'Zero arguments' -Expected $usage -CliArgs @()
          Assert-Output -Case 'Two arguments' -Expected $usage -CliArgs @('one', 'two')
          Assert-Output -Case 'Relative path' -Expected 'Error: Please provide an absolute image path.' -CliArgs @('relative.jpg')
          Assert-Output -Case 'Missing file' -Expected 'Error: Image file does not exist.' -CliArgs @($missingPath)
          Assert-Output -Case 'Invalid JPEG' -Expected 'Error: Cannot decode the image.' -CliArgs @($invalidPath)

          $zip = Join-Path $env:RUNNER_TEMP 'VerticalLineCounter-win-x64.zip'
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $zip

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: VerticalLineCounter-win-x64
          path: ${{ runner.temp }}/VerticalLineCounter-win-x64.zip
          if-no-files-found: error

  publish-release:
    if: ${{ inputs.release_tag != '' }}
    needs: verify-windows
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: windows-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Attach verified ZIP and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a release tag such as v1.0.0.'
            exit 1
          fi

          matching_refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$matching_refs"; then
            echo "Tag $RELEASE_TAG already exists. Choose a new version."
            exit 1
          fi

          artifact_dir=$(mktemp -d)
          gh run download "$GITHUB_RUN_ID" --name VerticalLineCounter-win-x64 --dir "$artifact_dir"
          zip="$artifact_dir/VerticalLineCounter-win-x64.zip"
          unzip -tq "$zip"

          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "Vertical Line Counter $RELEASE_TAG" \
              --notes 'Extract the Windows x64 ZIP and keep all files together. Run VerticalLineCounter.exe with the absolute path to a JPEG. The package includes the .NET runtime.'
          fi

          gh release upload "$RELEASE_TAG" "$zip"
          gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --draft=false
